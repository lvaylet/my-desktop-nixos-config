name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Flake Check & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Run Flake Checks
        run: nix flake check --print-build-logs

  build:
    name: Build System (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: desktop-pc
            attribute: .#nixosConfigurations.desktop-pc.config.system.build.toplevel
          - target: homelab
            attribute: .#nixosConfigurations.homelab.config.system.build.toplevel
          - target: iso
            attribute: .#nixosConfigurations.iso.config.system.build.isoImage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build ${{ matrix.target }}
        run: nix build ${{ matrix.attribute }} --print-build-logs
